<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Site</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <span class="logo">Simple</span>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <h1>Welcome</h1>
      <p>A minimal website built with HTML, CSS & JavaScript.</p>
      <button class="cta" id="cta-btn">Click me</button>
      <p class="message" id="message"></p>
    </section>

    <section id="about" class="about">
      <h2>About</h2>
      <p>This is a simple, responsive single-page site. Edit the files and make it yours.</p>
    </section>

    <section id="contact" class="contact">
      <h2>Contact</h2>
      <form id="contact-form">
        <input type="text" id="name" placeholder="Your name" required>
        <input type="email" id="email" placeholder="Your email" required>
        <button type="submit">Send</button>
      </form>
      <p class="form-feedback" id="form-feedback"></p>
    </section>
  </main>

  <footer>
    <p>Simple Site &copy; <span id="year"></span></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
